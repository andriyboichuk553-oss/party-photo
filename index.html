<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Галерея Свята</title>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --primary-color: #bb86fc; 
            --text-color: #ffffff;
            --text-secondary: #aaaaaa;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            text-align: center;
            padding: 20px;
            background-color: var(--surface-color);
            border-bottom: 1px solid #333;
        }

        .tabs { display: flex; background-color: var(--surface-color); }
        .tab {
            flex: 1; text-align: center; padding: 15px; cursor: pointer;
            color: var(--text-secondary); border-bottom: 2px solid transparent;
        }
        .tab.active { color: var(--primary-color); border-bottom: 2px solid var(--primary-color); }

        .content { padding: 20px; display: none; text-align: center; }
        .content.active { display: block; }

        .highlight { color: var(--primary-color); font-weight: bold; font-size: 28px; }
        
        .camera-btn {
            background-color: var(--primary-color); color: #000;
            border: none; border-radius: 50px; padding: 18px 40px;
            font-size: 18px; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 15px rgba(187, 134, 252, 0.4);
        }
        .camera-btn:disabled { background-color: #555; box-shadow: none; }
        
        #hiddenCameraInput { display: none; }
        
        #statusMsg { margin-top: 15px; font-size: 14px; color: var(--primary-color); }
    </style>
</head>
<body>

    <header>
        <h1>Наше Свято 🎉</h1>
    </header>

    <div class="tabs">
        <div class="tab active" onclick="switchTab('camera')">📸 Камера</div>
        <div class="tab" onclick="switchTab('gallery')">🖼️ Галерея</div>
    </div>

    <div id="camera-section" class="content active">
        <p>Залишилось спроб: <br><span class="highlight" id="counter">5</span> / 5</p>
        
        <input type="file" accept="image/*" capture="environment" id="hiddenCameraInput">
        <button class="camera-btn" id="takePhotoBtn">Зробити фото</button>
        
        <div id="statusMsg"></div>
    </div>

    <div id="gallery-section" class="content">
        <p style="color: var(--text-secondary);">Галерея оновлюється автоматично...</p>
        <div id="galleryContainer">
            <!-- Тут будуть фото -->
        </div>
    </div>

    <script>
        // ==========================================
        // 1. ВСТАВ СВОЄ ПОСИЛАННЯ СЮДИ:
        // ==========================================
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwD6L5Ek2oX89eBYlzGZFFTfJJyIbvw22u65TYKexlBFVLgYwlSDryQy1UhUkR4bcAS/exec";

        let photosLeft = 5;
        const takePhotoBtn = document.getElementById('takePhotoBtn');
        const hiddenInput = document.getElementById('hiddenCameraInput');
        const counterText = document.getElementById('counter');
        const statusMsg = document.getElementById('statusMsg');

        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
            if(tabName === 'camera') {
                document.querySelectorAll('.tab')[0].classList.add('active');
                document.getElementById('camera-section').classList.add('active');
            } else {
                document.querySelectorAll('.tab')[1].classList.add('active');
                document.getElementById('gallery-section').classList.add('active');
            }
        }

        takePhotoBtn.addEventListener('click', () => {
            if (photosLeft > 0) hiddenInput.click();
        });

        hiddenInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (!file) return;

            statusMsg.innerText = "⏳ Завантаження фото на диск...";
            takePhotoBtn.disabled = true;

            const reader = new FileReader();
            reader.onloadend = function() {
                const base64String = reader.result.split(',')[1];
                
                fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors', 
                    body: JSON.stringify({
                        base64: base64String,
                        mimeType: file.type,
                        filename: "party_" + Date.now() + ".jpg"
                    })
                })
                .then(() => {
                    photosLeft--;
                    counterText.innerText = photosLeft;
                    statusMsg.innerText = "✅ Готово! Фото збережено.";
                    if (photosLeft <= 0) takePhotoBtn.innerText = "Ліміт вичерпано";
                })
                .catch(err => {
                    statusMsg.innerText = "❌ Помилка з'єднання.";
                    console.error(err);
                })
                .finally(() => {
                    if (photosLeft > 0) takePhotoBtn.disabled = false;
                    hiddenInput.value = ""; 
                });
            };
            reader.readAsDataURL(file);
        });
    </script>
</body>
</html>
